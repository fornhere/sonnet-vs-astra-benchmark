<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New York — Önizlemeler</title><style>*{box-sizing:border-box}body{margin:0;background:#eee8d8;color:#374232;font-family:Arial,sans-serif;padding:60px 5vw}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:40px}small{font-size:10px;letter-spacing:3px;color:#8a8b70}h1{font:normal 64px Georgia;margin:15px 0}p{font-size:13px;color:#858770;line-height:1.7}a{color:inherit;text-decoration:none}header a{border-bottom:1px solid #a6956c;padding-bottom:8px;font-size:13px}main{display:grid;grid-template-columns:repeat(2,1fr);gap:28px}figure{margin:0;background:#f8f4e9;border:1px solid #fff6e6;padding:10px 10px 18px;border-radius:7px}figure:hover{transform:translateY(-3px);box-shadow:0 10px 25px #413b2410}img{width:100%;display:block;border-radius:3px}figcaption{display:flex;gap:15px;margin:17px 10px 0;align-items:center;font-size:13px}figcaption span{color:#a99b76;font-size:10px}figcaption i{margin-left:auto;color:#9c997e;font-style:normal}figure:first-child{grid-column:1/-1}footer{margin-top:40px;font-size:11px;color:#92927b}@media(max-width:700px){body{padding:25px 15px}header{display:block}h1{font-size:45px}main{grid-template-columns:1fr}}</style><header><div><small>KÜÇÜK DÜNYA ATÖLYESİ / NO. 001</small><h1>New York, kare kare.</h1><p>Tarayıcıdan alınmış gerçek görüntüler. Bir kareyi tam çözünürlükte açmak için seçin.</p></div><a href="../index.html">Canlı makete dön ↗</a></header><main id="gallery"></main><footer>1920 × 1080 · Headless Chromium · Yerel Three.js · Harici görsel kullanılmadı.</footer><script>const items=[['00-genel-bakis.png','Genel bakış'],['01-liberty.png','Özgürlük Heykeli'],['02-empire.png','Empire State'],['03-chrysler.png','Chrysler Building'],['04-wtc.png','One World Trade Center'],['05-flatiron.png','Flatiron'],['06-bridge.png','Brooklyn Köprüsü'],['07-park.png','Central Park'],['08-times.png','Times Square'],['09-rockefeller.png','Rockefeller Center'],['10-grand.png','Grand Central'],['11-gece.png','Gece'],['12-karli.png','Karlı Manhattan'],['13-sisli.png','Sisli Manhattan'],['14-fotograf.png','Fotoğraf modu']];document.querySelector('#gallery').innerHTML=items.map(([src,name],i)=>`<a href="${src}"><figure><img src="${src}" alt="${name}" loading="lazy"><figcaption><span>${String(i).padStart(2,'0')}</span>${name}<i>↗</i></figcaption></figure></a>`).join('');</script></html>
